name: Backend Docker

on:
  push:
    branches: ["main"]
    paths:
      - "frontend/server/**"
      - ".github/workflows/backend-docker.yml"
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build and push backend image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend/server
          file: ./frontend/server/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/compraaudit-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/compraaudit-backend:${{ github.sha }}
      - name: Trigger Render deploy
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK }}" ]; then
            echo "RENDER_DEPLOY_HOOK não configurado"
            exit 1
          fi

          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"